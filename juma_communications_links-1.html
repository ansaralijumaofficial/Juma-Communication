<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUMA COMMUNICATIONS</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 24px;
    padding: 34px 24px;
    text-align: center;
    box-shadow: 0 12px 35px rgba(0,0,0,.12);
  }
  .logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111827;
    color: white;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
  }
  h1 {
    margin: 0;
    font-size: 25px;
    color: #111827;
  }
  p {
    margin: 10px 0 25px;
    color: #6b7280;
    line-height: 1.5;
  }
  a {
    display: block;
    text-decoration: none;
    padding: 16px 18px;
    margin: 14px 0;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    color: white;
    transition: transform .15s ease, opacity .15s ease;
  }
  a:hover { transform: translateY(-2px); opacity: .92; }
  .website { background: #2563eb; }
  .facebook { background: #1877f2; }
  .footer {
    margin-top: 24px;
    font-size: 13px;
    color: #9ca3af;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">JUMA</div>
    <h1>JUMA COMMUNICATIONS</h1>
    <p>Official links for our website and Facebook page.</p>

    <a class="website" href="https://ansaralijumaofficial.github.io/Juma-Communication/" target="_blank" rel="noopener">
      🌐 Official Website
    </a>

    <a class="facebook" href="https://www.facebook.com/profile.php?id=61592753082258" target="_blank" rel="noopener">
      📘 Official Facebook Page
    </a>

    <div class="footer">JUMA COMMUNICATIONS • Official</div>
  </main>
</body>
</html>
